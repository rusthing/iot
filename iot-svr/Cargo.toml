[package]
name = "iot-svr"
version = "1.0.0"
edition = "2024"
authors = ["zbz"]
license = "MIT"
keywords = ["iot", "server", "mqtt", "influxdb"]
description = "工业物联网数据接入服务：订阅 MQTT 采集数据并写入 InfluxDB"
categories = ["network-programming"]
homepage = "https://github.com/rusthing/iot"
repository = "https://github.com/rusthing/iot"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }
config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal"] }
influxdb = { workspace = true }
rumqttc = { workspace = true }

wheel-rs = { workspace = true }
# 数据接入服务是「无 Web / 无 DB」的服务，仅需 app（启动引导 + 信号）、
# macros（bootstrap!/log_call）、mqtt（订阅端）与 influxdb（时序库写入）
robotech = { workspace = true, features = ["app", "macros", "mqtt", "influxdb"] }

iot-api = { workspace = true }
