[workspace]
members = [
    "iot-api",
    "iot-svr",
    "iot-gatex",
    "iot-gatex/crate/iotg-core",
    "iot-gatex/crate/iotg-iec104",
    "iot-gatex/crate/iotg-modbus",
    "iot-gatex/crate/iotg-dlt645",
    "iot-gatex/crate/iotg-s7",
    "iot-gatex/crate/iotg-hj212",
    "iot-gatex/crate/iotg-mqtt",
]
resolver = "3"

[workspace.dependencies]
# cross打包时用，需要开启 vendored feature
openssl = "0.10.81"

anyhow = "1.0.104"
tracing = "0.1.44"
thiserror = "2.0.21"
clap = "4.6.7"
chrono = "0.4.45"
config = "0.15.27"
derive_setters = "0.1.9"
typed-builder = "0.23.2"
async-trait = "0.1.92"
serde = "1.0.229"
serde_with = "3.24.0"
serde_json = "1.0.154"
tokio = "=1.53.3"
bytes = "1.12.1"
hex = "0.4.3"
rumqttc = "0.25.1"
num_enum = "0.7.6"
influxdb = "0.8.0"
strum = "0.28.0"

wheel-rs = "1.12.0"
robotech = "1.16.0"
robotech-macros = "1.16.0"

iot-api = { version = "1.0.0", path = "./iot-api" }

iotg-core = { path = "iot-gatex/crate/iotg-core" }
iotg-iec104 = { path = "iot-gatex/crate/iotg-iec104" }
iotg-modbus = { path = "iot-gatex/crate/iotg-modbus" }
iotg-dlt645 = { path = "iot-gatex/crate/iotg-dlt645" }
iotg-s7 = { path = "iot-gatex/crate/iotg-s7" }
iotg-hj212 = { path = "iot-gatex/crate/iotg-hj212" }
iotg-mqtt = { path = "iot-gatex/crate/iotg-mqtt" }

[patch.crates-io]
#idworker = { path = "../idworker" }
wheel-rs = { path = "../wheel-rs" }
robotech = { path = "../robotech-rs/robotech" }
robotech-macros = { path = "../robotech-rs/robotech-macros" }
iot-api = { path = "./iot-api" }
