[package]
name = "iot-gatex"
version = "1.0.0"
edition = "2024"
authors = ["zbz"]
license = "MIT"
keywords = ["iot", "gateway", "protocol", "collector"]
description = "多协议工业物联网网关，采集数据实时发布至 MQTT"
categories = ["network-programming"]
homepage = "https://github.com/rusthing/iot"
repository = "https://github.com/rusthing/iot"
readme = "README.md"

[dependencies]
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal"] }

wheel-rs = { workspace = true }
# 网关是「无 Web / 无 DB」的服务，仅需 app（启动引导 + 信号）与 macros（bootstrap!/log_call）
robotech = { workspace = true, features = ["app", "macros"] }

iotg-core = { workspace = true }
iotg-iec104 = { workspace = true }
iotg-modbus = { workspace = true }
iotg-dlt645 = { workspace = true }
iotg-s7 = { workspace = true }
iotg-hj212 = { workspace = true }
iotg-mqtt = { workspace = true }
